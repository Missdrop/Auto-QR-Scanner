[project]
name = "auto-qr-scanner"
version = "0.1.0"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "numpy>=2.2,<3",
    "opencv-python-headless>=4.11,<5",
    "playwright>=1.65.1",
    "pyside6-essentials>=6.8,<6.9",
    "zxing-cpp>=3.1.1",
]

[project.optional-dependencies]
wechat = [
    "wxauto4>=41.1.7 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pyrefly>=1.4.1",
    "ruff>=0.17.4",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyrefly]
project-includes = ["src"]

[project]
name = "auto-qr-scanner"
version = "0.1.0"
requires-python = ">=3.12"
readme = "README.md"
dependencies = []

[dependency-groups]
dev = [
    "pyrefly>=1.4.1",
    "ruff>=0.17.4",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyrefly]
project-includes = ["src"]

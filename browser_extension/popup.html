<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Auto QR Scanner</title>
<style>body{font:14px system-ui;width:300px;padding:12px}input{width:100%;box-sizing:border-box}button{margin-top:10px}p{line-height:1.5}</style>
</head><body>
<h3>Auto QR Scanner Companion</h3>
<p>Click Copy browser pairing code in the desktop app, then paste it here.</p>
<label for="code">Local pairing code</label><input id="code" type="password" autocomplete="off">
<button id="pair">Pair with desktop app</button>
<p id="status" role="status"></p>
<p id="session" role="status"></p>
<script src="popup.js"></script>
</body></html>

name: Publish release

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that the tag belongs to main
        id: branch
        shell: bash
        run: |
          git fetch origin main
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag is outside main; skipping release."
          fi

      - name: Publish GitHub release
        if: steps.branch.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release already exists."
            exit 0
          fi
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
